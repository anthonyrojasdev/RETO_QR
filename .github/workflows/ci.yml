name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Pruebas unitarias e integración de cada servicio ----------------------
  qr-api:
    name: QR API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/qr-api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/qr-api/go.mod
          cache-dependency-path: services/qr-api/go.sum
      - run: go vet ./...
      - run: go test -race -cover ./...

  stats-api:
    name: Stats API (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/stats-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/stats-api/package-lock.json
      - run: npm ci
      - run: npm test

  auth-api:
    name: Auth API (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/auth-api/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # --- Pruebas de extremo a extremo con todo el sistema en Docker -----------
  e2e:
    name: E2E (Kong + servicios + PostgreSQL + Redis)
    needs: [qr-api, stats-api, auth-api, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: Levantar el sistema
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test tests/e2e/
      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  # --- Publicación de imágenes en GitHub Container Registry -----------------
  publish:
    name: Publicar imagen ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: qr-api
            context: services/qr-api
          - service: stats-api
            context: services/stats-api
          - service: auth-api
            context: services/auth-api
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/reto-qr-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # --- Despliegue en la nube (VM con Docker) ---------------------------------
  # Se activa definiendo la variable DEPLOY_ENABLED=true y los secretos
  # DEPLOY_HOST, DEPLOY_USER y DEPLOY_SSH_KEY en el repositorio. Ver README.
  deploy:
    name: Desplegar en la VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read # el token temporal del job permite al VPS descargar las imágenes privadas
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/reto-qr
            test -f .env || { echo "Falta ~/reto-qr/.env en el VPS (cp .env.prod.example .env)"; exit 1; }
            git pull --ff-only
            export IMAGE_TAG=${{ github.sha }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker logout ghcr.io
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --wait
            docker image prune -f
