server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Se usa "expires" y no add_header dentro de location: un add_header ahí
    # anularía las cabeceras de seguridad definidas arriba.

    # Los archivos de /assets llevan un hash en el nombre: se pueden cachear un año.
    location /assets/ {
        expires 1y;
    }

    # Aplicación de una sola página: cualquier ruta sirve index.html, siempre revalidado.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
